<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نمایش تصویر</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f5f7fb;
      font-family: Tahoma, Arial, sans-serif;
      color: #202938;
    }
    main { width: 100%; max-width: 1000px; text-align: center; }
    img {
      display: none;
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 12px;
      background: white;
    }
    #status { color: #64748b; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <p id="status">در حال بارگذاری تصویر…</p>
    <img id="picture" alt="تصویر بارگذاری‌شده از فایل 1.png.txt">
  </main>
  <script>
    async function showImage() {
      const status = document.getElementById("status");
      const image = document.getElementById("picture");
      const url = "https://raw.githubusercontent.com/hadilaptop/photo-uploader-site/main/1.png.txt?cache=" + Date.now();

      try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("خواندن فایل ناموفق بود (HTTP " + response.status + ").");

        let base64 = (await response.text()).trim();
        if (!base64) throw new Error("فایل 1.png.txt خالی است. کد Base64 تصویر را داخل آن قرار بده.");

        const dataUrl = base64.match(/^data:image\/([a-zA-Z0-9.+-]+);base64,([\s\S]*)$/);
        if (dataUrl) base64 = dataUrl[2];

        base64 = base64
          .replace(/^-----BEGIN[^\n]*-----|-----END[^\n]*-----$/gm, "")
          .replace(/\s+/g, "")
          .replace(/-/g, "+")
          .replace(/_/g, "/");

        if (!/^[A-Za-z0-9+/]*={0,2}$/.test(base64) || base64.length % 4 === 1) {
          throw new Error("محتوای فایل، Base64 معتبر نیست.");
        }

        base64 += "=".repeat((4 - base64.length % 4) % 4);
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

        let mime = "";
        if (bytes.length >= 8 && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47) mime = "image/png";
        else if (bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) mime = "image/jpeg";
        else if (binary.startsWith("GIF87a") || binary.startsWith("GIF89a")) mime = "image/gif";
        else if (binary.startsWith("RIFF") && binary.slice(8, 12) === "WEBP") mime = "image/webp";
        else if (bytes[0] === 0x42 && bytes[1] === 0x4d) mime = "image/bmp";
        else if (binary.slice(4, 12).includes("ftypavif")) mime = "image/avif";
        else throw new Error("فرمت تصویر پشتیبانی نمی‌شود یا Base64 معتبر نیست.");

        const blob = new Blob([bytes], { type: mime });
        const objectUrl = URL.createObjectURL(blob);
        image.onload = () => {
          image.style.display = "inline-block";
          status.textContent = "";
          URL.revokeObjectURL(objectUrl);
        };
        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          status.textContent = "مرورگر نتوانست تصویر را نمایش دهد.";
        };
        image.src = objectUrl;
      } catch (error) {
        status.textContent = error.message || "خطا در بارگذاری تصویر.";
      }
    }

    showImage();
  </script>
</body>
</html>
