<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>گالری تصاویر</title>
    <style>
        body {
            font-family: Tahoma, Arial;
            margin: 24px;
            background: #f5f7fb;
            color: #202938
        }

        h1 {
            text-align: center
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px
        }

        .item {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #0001
        }

        .item img {
            width: 100%;
            height: 190px;
            object-fit: contain
        }

        .name {
            font-size: 12px;
            overflow-wrap: anywhere
        }
    </style>
</head>

<body>
    <div class="gallery"><img
                src="./images/test.png" alt="تصویر آزمایشی">
            <div class="name">images/test.png</div>
        </a></div>
  
</body>

</html>
