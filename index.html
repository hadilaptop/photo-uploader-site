<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گالری تصاویر</title><style>body{font-family:Tahoma,Arial;margin:24px;background:#f5f7fb;color:#202938}h1{text-align:center}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.item{background:white;padding:10px;border-radius:12px;box-shadow:0 2px 10px #0001}.item img{width:100%;height:190px;object-fit:contain}.name{font-size:12px;overflow-wrap:anywhere}</style></head><body><h1>گالری تصاویر</h1><p id="status">در حال بارگذاری تصاویر...</p><div id="gallery" class="gallery"></div><script>const owner="hadilaptop", repo="photo-uploader-images";fetch("https://api.github.com/repos/"+owner+"/"+repo+"/contents/uploads?ref=main").then(r=>{if(!r.ok)throw Error("هنوز عکسی آپلود نشده یا دریافت فهرست ممکن نیست");return r.json()}).then(files=>{const imgs=files.filter(f=>f.type==="file"&&/\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name));document.getElementById("status").textContent=imgs.length?("تعداد تصاویر: "+imgs.length):"هنوز تصویری آپلود نشده";const g=document.getElementById("gallery");imgs.sort((a,b)=>b.name.localeCompare(a.name)).forEach(f=>{const a=document.createElement("a");a.href=f.download_url;a.target="_blank";a.rel="noopener";a.className="item";const i=document.createElement("img");i.src=f.download_url;i.loading="lazy";i.alt=f.name;const n=document.createElement("div");n.className="name";n.textContent=f.name;a.append(i,n);g.appendChild(a)})}).catch(e=>document.getElementById("status").textContent=e.message);</script></body></html>
