<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>گالری تصاویر</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #202938;
    }
    header { max-width: 1200px; margin: 0 auto 24px; text-align: center; }
    h1 { margin: 0 0 10px; font-size: clamp(24px, 4vw, 34px); }
    #status { margin: 0; color: #64748b; font-size: 14px; overflow-wrap: anywhere; }
    .gallery {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr));
      gap: 18px;
    }
    .item {
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e5eaf2;
      border-radius: 14px;
      box-shadow: 0 3px 14px #1822300b;
    }
    .preview {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      max-height: 320px;
      overflow: hidden;
      border-radius: 9px;
      background: #eef2f7;
    }
    .preview img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: contain;
    }
    .name {
      direction: ltr;
      text-align: left;
      font-size: 13px;
      overflow-wrap: anywhere;
      color: #334155;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #e8efff;
      color: #234ca5;
      font-size: 13px;
      text-decoration: none;
    }
    .actions a:hover { background: #dbe7ff; }
    .empty {
      grid-column: 1 / -1;
      padding: 24px;
      border-radius: 12px;
      background: white;
      text-align: center;
      overflow-wrap: anywhere;
    }
    @media (max-width: 480px) { body { padding: 16px; } .gallery { grid-template-columns: 1fr; } }
  
    .base64-tool {
      max-width: 900px; margin: 0 auto 28px; padding: 18px;
      background: #fff; border: 1px solid #dbe4f0; border-radius: 16px;
      box-shadow: 0 3px 14px #1822300b;
    }
    .base64-tool h2 { margin: 0 0 8px; font-size: 19px; }
    .base64-tool p { color: #64748b; font-size: 13px; line-height: 1.8; margin: 0 0 12px; }
    .base64-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .base64-tool input[type=file] { max-width: 100%; padding: 9px; background: #f8fafc; border: 1px solid #dbe3ee; border-radius: 8px; }
    #base64Text { width: 100%; min-height: 120px; margin: 12px 0; padding: 12px; resize: vertical; direction: ltr; text-align: left; font: 12px/1.6 Consolas, monospace; border: 1px solid #dbe3ee; border-radius: 9px; }
    .base64-tool button { border: 0; border-radius: 8px; padding: 10px 16px; background: #2457bd; color: white; cursor: pointer; font: inherit; }
    .base64-tool button:hover { background: #19479f; }
    #base64Status { margin: 10px 0; font-size: 13px; overflow-wrap: anywhere; }
    #base64PreviewWrap { display: none; margin-top: 14px; padding: 12px; background: #f1f5f9; border-radius: 10px; text-align: center; }
    #base64Preview { max-width: 100%; max-height: 560px; object-fit: contain; }

  </style>
</head>
<body>
  <header>
    <h1>گالری تصاویر</h1>
    <p id="status" role="status" aria-live="polite">در حال دریافت فهرست تصاویر…</p>
  </header>
  
  <section class="base64-tool" aria-labelledby="base64Heading">
    <h2 id="base64Heading">نمایش تصویر از کد Base64</h2>
    <p>برای نمایش خودکار، کد Base64 را داخل فایل <bdi dir="ltr">1.png.txt</bdi> در ریشه مخزن GitHub قرار بده. همچنین می‌توانی فایل متنی انتخاب کنی یا کد را دستی وارد کنی. پردازش تصویر در مرورگر انجام می‌شود.</p>
    <div class="base64-controls">
      <input id="base64File" type="file" accept=".txt,.b64,.base64,text/plain">
      <button id="showBase64Image" type="button">نمایش تصویر</button>
    </div>
    <textarea id="base64Text" spellcheck="false" placeholder="کد Base64 را اینجا قرار بده…"></textarea>
    <p id="base64Status" role="status" aria-live="polite">هنوز فایلی انتخاب نشده است.</p>
    <div id="base64PreviewWrap"><img id="base64Preview" alt="پیش‌نمایش تصویر استخراج‌شده از Base64"></div>
  </section>

  <main id="gallery" class="gallery"></main>

  <script>
    const owner = "hadilaptop";
    const repository = "photo-uploader-site";
    const folder = "uploads";
    const branch = "main";
    const gallery = document.getElementById("gallery");
    const status = document.getElementById("status");
    let lastDirectoryCheck = 0;
    // تصاویر پیدا‌شده در پوشه را بین به‌روزرسانی‌ها نگه می‌داریم تا از گالری حذف نشوند.
    let discoveredDirectoryImages = [];

    function showMessage(message) {
      const box = document.createElement("p");
      box.className = "empty";
      box.textContent = message;
      gallery.replaceChildren(box);
    }

    function makeCard(file) {
      const card = document.createElement("article");
      card.className = "item";

      const previewLink = document.createElement("a");
      previewLink.className = "preview";
      previewLink.href = file.html_url || file.download_url;
      previewLink.target = "_blank";
      previewLink.rel = "noopener noreferrer";
      previewLink.setAttribute("aria-label", "بازکردن تصویر " + file.name);

      const img = document.createElement("img");
      img.src = file.download_url;
      img.alt = file.name;
      img.loading = "lazy";
      img.decoding = "async";
      img.addEventListener("error", () => {
        previewLink.replaceChildren();
        const fallback = document.createElement("span");
        fallback.textContent = "نمایش تصویر ممکن نیست";
        previewLink.appendChild(fallback);
      }, { once: true });
      previewLink.appendChild(img);

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = file.name;

      const actions = document.createElement("div");
      actions.className = "actions";
      const directLink = document.createElement("a");
      directLink.href = file.download_url;
      directLink.target = "_blank";
      directLink.rel = "noopener noreferrer";
      directLink.textContent = "بازکردن تصویر اصلی";
      directLink.setAttribute("aria-label", "بازکردن تصویر اصلی " + file.name);
      actions.appendChild(directLink);

      card.append(previewLink, name, actions);
      return card;
    }

    async function loadGallery(forceDirectoryCheck = false) {
      status.textContent = "در حال به‌روزرسانی فهرست تصاویر…";
      const manifestUrl = "https://raw.githubusercontent.com/" +
        owner + "/" + repository + "/" + branch + "/uploads.json?cacheBust=" + Date.now();
      const apiUrl = "https://api.github.com/repos/" + owner + "/" + repository +
        "/contents/" + folder + "?ref=" + branch;

      try {
        let images = [];
        let manifestLoaded = false;

        // ابتدا manifest را می‌خوانیم تا ترتیب و کش API گیت‌هاب مانع نمایش عکس جدید نشود.
        try {
          const manifestResponse = await fetch(manifestUrl, { cache: "no-store" });
          if (manifestResponse.ok) {
            const manifest = await manifestResponse.json();
            if (!manifest || !Array.isArray(manifest.images)) {
              throw new Error("ساختار uploads.json معتبر نیست.");
            }
            images = manifest.images
              .filter(item => item && item.name && item.download_url)
              .sort((a, b) => {
                const timeA = a.uploaded_at ? Date.parse(a.uploaded_at) : 0;
                const timeB = b.uploaded_at ? Date.parse(b.uploaded_at) : 0;
                if (timeA !== timeB) return timeB - timeA;
                return Number(b.id || 0) - Number(a.id || 0);
              })
              .map(item => ({
                name: item.name,
                download_url: item.download_url,
                html_url: item.download_url,
                uploaded_at: item.uploaded_at,
                id: item.id
              }));
            manifestLoaded = true;
          }
        } catch (manifestError) {
          console.warn("خواندن uploads.json ممکن نشد؛ فهرست معمولی GitHub بررسی می‌شود.", manifestError);
        }

        // فهرست پوشه را هر 60 ثانیه هم بررسی می‌کنیم تا عکس‌هایی که به manifest اضافه نشده‌اند گم نشوند.
        if (forceDirectoryCheck || !manifestLoaded || !images.length || Date.now() - lastDirectoryCheck >= 60000) {
          try {
            const response = await fetch(apiUrl + "&cacheBust=" + Date.now(), {
              cache: "no-store",
              headers: { "Accept": "application/vnd.github+json" }
            });
            if (response.status === 404 && !manifestLoaded && !images.length) {
              // مخزن تازه هنوز پوشه uploads ندارد؛ این وضعیت خطا نیست.
              discoveredDirectoryImages = [];
              lastDirectoryCheck = Date.now();
            } else if (!response.ok) {
              if (!manifestLoaded || !images.length) {
                throw new Error(response.status === 403
                  ? "محدودیت موقت درخواست‌های GitHub؛ کمی بعد دوباره امتحان کنید."
                  : "دریافت فهرست تصاویر ناموفق بود (HTTP " + response.status + ").");
              }
            } else {
              const files = await response.json();
              if (!Array.isArray(files)) throw new Error("پاسخ مخزن تصاویر قابل شناسایی نیست.");
              const directoryImages = files
                .filter(file => file.type === "file" &&
                  /\.(avif|gif|jpe?g|png|webp|bmp|svg)$/i.test(file.name) &&
                  file.download_url)
                .sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true }));
              const discoveredByName = new Map(discoveredDirectoryImages.map(item => [item.name.toLowerCase(), item]));
              for (const file of directoryImages) discoveredByName.set(file.name.toLowerCase(), file);
              discoveredDirectoryImages = [...discoveredByName.values()];
              if (!images.length) images = directoryImages;
              lastDirectoryCheck = Date.now();
            }
          } catch (directoryError) {
            if (!manifestLoaded || !images.length) throw directoryError;
            console.warn("بررسی پوشه GitHub موقتاً ناموفق بود؛ از uploads.json استفاده می‌شود.", directoryError);
          }
        }

        // تصاویر واقعی پوشه را با manifest ادغام می‌کنیم؛ در refresh بعدی هم باقی می‌مانند.
        const manifestNames = new Set(images.map(item => item.name.toLowerCase()));
        const missingFromManifest = discoveredDirectoryImages
          .filter(item => !manifestNames.has(item.name.toLowerCase()))
          .sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true }));
        images = [...missingFromManifest, ...images];

        if (!images.length) {
          status.textContent = "هنوز تصویری در پوشه uploads پیدا نشد.";
          showMessage("تصویری برای نمایش وجود ندارد.");
          return;
        }

        gallery.replaceChildren(...images.map(makeCard));
        status.textContent = images.length + " تصویر دریافت شد؛ آخرین بررسی: " +
          new Date().toLocaleTimeString("fa-IR");
      } catch (error) {
        status.textContent = "به‌روزرسانی تصاویر انجام نشد.";
        showMessage((error && error.message ? error.message : "خطای ناشناخته") +
          " اتصال به GitHub و دسترسی مخزن را بررسی کنید.");
      }
    }

    // اگر صفحه باز باشد، هر 10 ثانیه فهرست را تازه می‌کنیم.
    let galleryRefreshInProgress = false;
    async function refreshGallery(forceDirectoryCheck = false) {
      if (galleryRefreshInProgress) return;
      galleryRefreshInProgress = true;
      try {
        await loadGallery(forceDirectoryCheck);
      } finally {
        galleryRefreshInProgress = false;
      }
    }

    window.addEventListener("focus", refreshGallery);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshGallery();
    });
    window.setInterval(refreshGallery, 10000);

    const refreshButton = document.createElement("button");
    refreshButton.type = "button";
    refreshButton.textContent = "به‌روزرسانی گالری";
    refreshButton.style.cssText = "display:block;margin:14px auto 0;padding:9px 16px;border:0;border-radius:8px;background:#e8efff;color:#234ca5;cursor:pointer;font:inherit";
    refreshButton.addEventListener("click", () => refreshGallery(true));
    document.querySelector("header").appendChild(refreshButton);


    // Base64 viewer: load the repository's 1.png.txt automatically, or accept manual input.
    const base64FileInput = document.getElementById("base64File");
    const base64TextInput = document.getElementById("base64Text");
    const base64Status = document.getElementById("base64Status");
    const base64Preview = document.getElementById("base64Preview");
    const base64PreviewWrap = document.getElementById("base64PreviewWrap");
    let base64ObjectUrl = null;

    function displayBase64Image(sourceText) {
      let raw = sourceText.trim().replace(/^\\uFEFF/, "");
      const dataUrlMatch = raw.match(/^data:image\\/(png|jpeg|jpg|gif|webp|bmp|avif);base64,([\\s\\S]*)$/i);
      if (dataUrlMatch) raw = dataUrlMatch[2];
      raw = raw.replace(/^-----BEGIN[^\\n]*-----|-----END[^\\n]*-----$/gm, "")
        .replace(/\\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
      if (!raw) throw new Error("کد Base64 خالی است.");
      if (!/^[A-Za-z0-9+/]*={0,2}$/.test(raw) || raw.length % 4 === 1) {
        throw new Error("ساختار کد Base64 معتبر نیست.");
      }
      raw += "=".repeat((4 - raw.length % 4) % 4);
      const binary = atob(raw);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      let mime = "";
      if (bytes.length >= 8 && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47) mime = "image/png";
      else if (bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) mime = "image/jpeg";
      else if (binary.startsWith("GIF87a") || binary.startsWith("GIF89a")) mime = "image/gif";
      else if (binary.startsWith("RIFF") && binary.slice(8, 12) === "WEBP") mime = "image/webp";
      else if (bytes[0] === 0x42 && bytes[1] === 0x4d) mime = "image/bmp";
      else if (bytes.length > 12 && binary.slice(4, 12).includes("ftypavif")) mime = "image/avif";
      else throw new Error("نوع تصویر پشتیبانی نمی‌شود یا فایل، Base64 یک تصویر معتبر نیست.");

      const blob = new Blob([bytes], { type: mime });
      if (base64ObjectUrl) URL.revokeObjectURL(base64ObjectUrl);
      base64ObjectUrl = URL.createObjectURL(blob);
      base64Preview.onload = () => {
        base64PreviewWrap.style.display = "block";
        base64Status.textContent = "تصویر با موفقیت نمایش داده شد (" + mime + "، " +
          base64Preview.naturalWidth + " × " + base64Preview.naturalHeight + ").";
      };
      base64Preview.onerror = () => {
        base64PreviewWrap.style.display = "none";
        base64Status.textContent = "داده رمزگشایی شد، اما مرورگر نتوانست تصویر را نمایش دهد.";
      };
      base64Preview.src = base64ObjectUrl;
    }

    base64FileInput.addEventListener("change", async () => {
      const file = base64FileInput.files && base64FileInput.files[0];
      if (!file) return;
      try {
        base64TextInput.value = await file.text();
        base64Status.textContent = "فایل خوانده شد: " + file.name + " — برای نمایش روی دکمه بزن.";
        base64PreviewWrap.style.display = "none";
      } catch (error) {
        base64Status.textContent = "خواندن فایل ناموفق بود: " + error.message;
      }
    });

    document.getElementById("showBase64Image").addEventListener("click", () => {
      try {
        displayBase64Image(base64TextInput.value);
      } catch (error) {
        base64PreviewWrap.style.display = "none";
        base64Status.textContent = error.message || "خطا در خواندن Base64.";
      }
    });

    async function loadBase64FromRepository() {
      const base64Url = "https://raw.githubusercontent.com/" +
        owner + "/" + repository + "/" + branch + "/1.png.txt?cacheBust=" + Date.now();
      try {
        const response = await fetch(base64Url, { cache: "no-store" });
        if (!response.ok) {
          if (response.status === 404) {
            base64Status.textContent = "فایل 1.png.txt هنوز در ریشه مخزن قرار نگرفته است.";
            return;
          }
          throw new Error("دریافت فایل Base64 ناموفق بود (HTTP " + response.status + ").");
        }
        const content = await response.text();
        base64TextInput.value = content;
        displayBase64Image(content);
      } catch (error) {
        base64Status.textContent = "خواندن خودکار 1.png.txt انجام نشد: " + error.message;
      }
    }

    loadGallery();
    loadBase64FromRepository();
  </script>
</body>
</html>
